<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4d1620"/>
      <stop offset="45%" stop-color="#2a0c12"/>
      <stop offset="100%" stop-color="#140508"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5e6"/>
      <stop offset="35%" stop-color="#e8d7c3"/>
      <stop offset="70%" stop-color="#ea8b70"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea8b70"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Sacred Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Ornate Border Framing -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="rgba(217, 194, 167, 0.3)" stroke-width="2"/>
  <rect x="36" y="36" width="1128" height="558" rx="12" fill="none" stroke="rgba(234, 139, 112, 0.15)" stroke-width="1" stroke-dasharray="4,6"/>

  <!-- Corner Vedic Ornaments -->
  <g fill="none" stroke="url(#goldGradient)" stroke-width="2">
    <!-- Top-Left -->
    <path d="M48 68 L68 48 M48 48 L88 48 M48 48 L48 88"/>
    <!-- Top-Right -->
    <path d="M1152 68 L1132 48 M1152 48 L1112 48 M1152 48 L1152 88"/>
    <!-- Bottom-Left -->
    <path d="M48 562 L68 582 M48 582 L88 582 M48 582 L48 542"/>
    <!-- Bottom-Right -->
    <path d="M1152 562 L1132 582 M1152 582 L1112 582 M1152 582 L1152 542"/>
  </g>

  <!-- Sacred Vedic Sun / Mandala Aura (Center Backing) -->
  <g opacity="0.08" stroke="url(#goldGradient)" stroke-width="1.5" fill="none">
    <circle cx="600" cy="230" r="140"/>
    <circle cx="600" cy="230" r="180"/>
    <circle cx="600" cy="230" r="220" stroke-dasharray="6,8"/>
    <circle cx="600" cy="230" r="260"/>
  </g>

  <!-- Central Trinetra Emblem -->
  <g transform="translate(600, 160) scale(1.6)" filter="url(#glow)">
    <circle cx="0" cy="0" r="44" fill="rgba(34, 11, 16, 0.85)" stroke="url(#goldGradient)" stroke-width="2"/>
    <path d="M-32 0 C-16 -24, 16 -24, 32 0 C16 24, -16 24, -32 0 Z" fill="rgba(72, 24, 34, 0.85)" stroke="url(#goldGradient)" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="url(#flameGradient)"/>
    <circle cx="2" cy="-2" r="4" fill="#ffffff"/>
    <path d="M0 -34 C3 -26, 6 -22, 0 -15 C-6 -22, -3 -26, 0 -34 Z" fill="url(#flameGradient)"/>
  </g>

  <!-- Sacred Mantra & Title -->
  <text x="600" y="275" text-anchor="middle" font-family="'Cinzel', serif" font-size="22" font-weight="600" fill="#ea8b70" letter-spacing="4">
    ॥ ॐ श्री गणेशाय नमः ॥
  </text>

  <text x="600" y="340" text-anchor="middle" font-family="'Rozha One', 'Cinzel', serif" font-size="54" font-weight="700" fill="url(#goldGradient)" letter-spacing="2">
    वेदनेत्र • VedNetra
  </text>

  <text x="600" y="390" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="500" fill="#ffffff" letter-spacing="1">
    पं. राकेश चन्द्र रावल — वैदिक अनुष्ठान एवं ज्योतिष पीठ
  </text>

  <text x="600" y="430" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#d9c2a7" opacity="0.9">
    श्रीमद्भागवत कथा • महापूजा • नवग्रह शांति • कालसर्प व वास्तु दोष निवारण • कुण्डली मिलान
  </text>

  <!-- Tag Pills -->
  <g transform="translate(600, 485)">
    <!-- Pill 1 -->
    <rect x="-290" y="0" width="170" height="38" rx="19" fill="rgba(234, 139, 112, 0.15)" stroke="rgba(234, 139, 112, 0.4)"/>
    <text x="-205" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#fdf6ec">प्रत्यक्ष एवं ऑनलाइन</text>

    <!-- Pill 2 -->
    <rect x="-100" y="0" width="200" height="38" rx="19" fill="rgba(217, 194, 167, 0.15)" stroke="rgba(217, 194, 167, 0.4)"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#fdf6ec">हरिद्वार / ऋषिकेश पीठ</text>

    <!-- Pill 3 -->
    <rect x="120" y="0" width="170" height="38" rx="19" fill="rgba(234, 139, 112, 0.15)" stroke="rgba(234, 139, 112, 0.4)"/>
    <text x="205" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#fdf6ec">शास्त्रोक्त सङ्कल्प</text>
  </g>

  <!-- Domain Footer -->
  <text x="600" y="565" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#ea8b70" letter-spacing="2">
    WWW.VEDNETRA.COM • +91 98765 43210
  </text>
</svg>

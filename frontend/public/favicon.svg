<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#481822"/>
      <stop offset="50%" stop-color="#682e36"/>
      <stop offset="100%" stop-color="#220b10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="35%" stop-color="#d9c2a7"/>
      <stop offset="70%" stop-color="#ea8b70"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea8b70"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>

  <!-- Circular Base with Burgundy Texture -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="rgba(217, 194, 167, 0.25)" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Trinetra (Third Eye) Outer Almond Contour -->
  <path d="M12 32 C18 20, 46 20, 52 32 C46 44, 18 44, 12 32 Z" 
        fill="rgba(34, 11, 16, 0.85)" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        stroke-linejoin="round"/>

  <!-- Sacred Inner Eye Rings -->
  <circle cx="32" cy="32" r="8" fill="rgba(72, 24, 34, 0.9)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="4.5" fill="url(#flameGrad)"/>
  <circle cx="33.5" cy="30.5" r="1.5" fill="#ffffff"/>

  <!-- Upward Rising Sacred Flame (Jyoti) -->
  <path d="M32 11 C34 16, 36.5 19, 32 24 C27.5 19, 30 16, 32 11 Z" fill="url(#flameGrad)"/>

  <!-- Sacred Tilak / Tripundra lines -->
  <path d="M26 18 Q32 20 38 18" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M27 15 Q32 17 37 15" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round" fill="none"/>
</svg>